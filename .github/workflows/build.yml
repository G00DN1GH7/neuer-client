name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neuer-client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
